<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖遺物・武器最適化ランキング</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f8fafc;--mu:#94a3b8;--pr:#10b981;--ac:#38bdf8;--bd:#334155;--hv:#273548;--gold:#fbbf24}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:20px}
.wrap{max-width:1250px;margin:0 auto}h1{color:var(--pr);font-size:22px;text-align:center;margin:0 0 16px}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:end;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.bar label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}.bar input{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;width:90px}
.bar button{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:9px 18px;font-weight:bold;cursor:pointer}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:12px;cursor:pointer;user-select:none}th.on{color:var(--ac)}tr.m{cursor:pointer}tr.m:hover td{background:var(--hv)}
.ic{width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-right:6px}.alt{font-size:12px;margin-right:6px}
.cv{color:var(--gold);font-weight:bold}.sm{font-size:11px;color:var(--mu)}tr.d td{background:#16202f;display:none}tr.d.o td{display:table-cell}
.d table{font-size:12px}.d th{cursor:default}
</style></head><body><div class="wrap">
<h1>聖遺物・武器最適化ランキング</h1>
<div class="bar">
 <div><label>ベース可変ロール数</label><input type="number" id="rolls" value="20" min="5" max="40"></div>
 <div><label>チャージロール数 (必ず消費)</label><input type="number" id="er" value="0" min="0" max="40"></div>
 <button id="go">計算</button>
 <span class="sm">武器×聖遺物×メインステを総当たりし、各組み合わせで最適なサブステ割り振りを探索 / 行をクリックで上位10件</span>
</div>
<div class="tw"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
</div>
<script src="common.js"></script>
<script src="characters/nahida.js"></script>
<script>
const $=id=>document.getElementById(id);
const img=(p,t)=>`<img class="ic" src="${p}" alt="${t}" title="${t}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:this.alt,className:'alt'}))">`;
const REF={em:['熟知','em'],atk:['攻撃力','atk']};
let rows=[],sk='cv',dir=-1;
const COLS=[['#',null],['キャラ',null],['武器',null],['聖遺物セット',null],['Crit Value','cv'],['元素バフ','buff'],['参照ステ1','r1'],['参照ステ2','r2'],['チャージ効率','er'],['期待値ダメージ','dmg']];
const key=(r,k)=>({cv:2*r.top.cr+r.top.cd,buff:r.top.elemBuff,r1:r.ref1,r2:r.ref2??-1,er:r.er,dmg:r.top.damage}[k]);
function run(){
  const rolls=+$('rolls').value||20,er=Math.min(rolls,Math.max(0,+$('er').value||0));
  rows=CHARACTERS.map(ch=>{const all=Engine.optimize(ch,{rolls,erRolls:er,party:ch.parties[0].key});const t=all[0];
    return{ch,all,top:t,er:100+Engine.ER_ROLL*er,ref1:t[ch.refs[0].key],ref2:ch.refs[1]?t[ch.refs[1].key]:null};});
  render();
}
function render(){
  $('head').innerHTML=COLS.map(([n,k])=>`<th data-k="${k||''}" class="${k===sk?'on':''}">${n}${k===sk?(dir<0?' ▼':' ▲'):''}</th>`).join('');
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(!k)return;dir=(k===sk)?-dir:-1;sk=k;render();});
  const list=[...rows].sort((a,b)=>dir*(key(a,sk)-key(b,sk)));
  $('body').innerHTML=list.map((r,i)=>{const t=r.top,c=r.ch;
    const fmt=(k,v)=>v==null?'':Math.round(v).toLocaleString();
    const main=`<tr class="m" data-i="${i}"><td>${i+1}</td><td>${img('images/others/char_'+c.id+'.png',c.name)}<b>${c.name}</b></td>
      <td>${img('images/weapons/'+t.weaponKey+'.png',t.weaponName)}</td><td>${img('images/artifacts/'+t.setKey+'.png',t.setName)}</td>
      <td><span class="sm">${t.cr.toFixed(1)} : ${t.cd.toFixed(1)}</span> <span class="cv">${(2*t.cr+t.cd).toFixed(1)} cv</span></td>
      <td>${t.elemBuff.toFixed(1)}%</td><td>${c.refs[0].label} ${fmt(0,r.ref1)}</td><td>${c.refs[1]?c.refs[1].label+' '+fmt(0,r.ref2):''}</td>
      <td>${r.er.toFixed(1)}%</td><td><b>${t.damage.toLocaleString()}</b></td></tr>`;
    const det=r.all.slice(0,10).map((x,j)=>`<tr><td>${j+1}</td><td>${x.weaponName}</td><td>${x.setName}</td><td>${x.mainNames}</td>
      <td>${c.subStats.map((s,q)=>c.subLabels[q]+' '+x.rolls[s]+' <span class="sm">[上限'+x.caps[s]+']</span>').join(' / ')}</td>
      <td class="cv">${(2*x.cr+x.cd).toFixed(1)}</td><td>${x.damage.toLocaleString()}</td></tr>`).join('');
    return main+`<tr class="d" id="d${i}"><td colspan="10"><table><thead><tr><th>#</th><th>武器</th><th>セット</th><th>メインステ (時計/杯/冠)</th><th>サブステ割振</th><th>CV</th><th>期待値</th></tr></thead><tbody>${det}</tbody></table></td></tr>`;}).join('');
  document.querySelectorAll('tr.m').forEach(tr=>tr.onclick=()=>$('d'+tr.dataset.i).classList.toggle('o'));
}
$('go').onclick=run;run();
</script></body></html>
