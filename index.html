<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原神 キャラ別 最適サブステ計算</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f8fafc;--mu:#94a3b8;--pr:#10b981;--ac:#38bdf8;--bd:#334155;--hv:#273548;--gold:#fbbf24}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:20px}
.wrap{max-width:1300px;margin:0 auto}h1{color:var(--pr);font-size:22px;text-align:center;margin:0 0 8px}.sub,.sm{font-size:12px;color:var(--mu)}.sub{text-align:center;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;color:inherit;text-decoration:none;transition:.2s}
.card:hover{border-color:var(--pr);background:var(--hv);transform:translateY(-2px)}.card .ic{width:48px;height:48px;border-radius:50%}
.flt{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:16px}.fr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.fl{font-size:12px;color:var(--mu);width:52px}
.chip{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;margin-right:2px}.chip .ic{width:18px;height:18px;margin:0 4px 0 0}.ref{white-space:nowrap}.ref .ic{width:18px;height:18px;margin:0 3px 0 0}.ab{font-size:11px;color:var(--mu);margin-right:4px}.ico img:not([style*="display:none"])+.ab{display:none}.card .sm .ic{width:16px;height:16px;margin:0 3px 0 0}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}.star{color:var(--gold);font-size:12px}.warnbar{background:#7f1d1d;color:#fecaca;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;line-height:1.7}.warn{color:#f87171;font-size:11px}
.back{color:var(--ac);text-decoration:none;font-size:14px;display:inline-block;margin-bottom:10px}
.bar{display:flex;gap:16px;flex-wrap:wrap;align-items:end;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.bar label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.bar input,.bar select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px}.bar input{width:90px}
.bar button{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:10px 22px;font-weight:bold;cursor:pointer}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-size:12px;user-select:none}th[data-k]{cursor:pointer}th.on{color:var(--ac)}tbody tr:hover td{background:var(--hv)}
.ic{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:6px}.cv{color:var(--gold);font-weight:bold}.empty{text-align:center;color:var(--mu);padding:28px}
</style></head><body><div class="wrap">
<div id="warn" class="warnbar" hidden></div>
<div id="portal"><h1>原神 キャラ別 最適サブステ計算</h1>
<div class="sub">キャラクターを選ぶと、武器・聖遺物セット・メインステの全パターンについて、最適なサブステ割り振りを計算します</div>
<div class="flt" id="flt">
 <div class="fr"><span class="fl">レア度</span><span id="f-r"></span></div>
 <div class="fr"><span class="fl">属性</span><span id="f-e"></span></div>
 <div class="fr"><span class="fl">武器種</span><span id="f-w"></span></div>
 <div class="fr"><button class="chip on" id="sort"></button><span class="sm" id="cnt"></span></div>
</div>
<div class="grid" id="grid"></div>
<div class="sub" style="margin-top:20px"><a href="check.html" style="color:#64748b">動かないとき: ファイルの版の確認</a></div></div>
<div id="view" hidden><a class="back" href="#">← キャラ選択へ戻る</a><h1 id="vt"></h1>
<div class="bar">
 <div><label>パーティ構成</label><select id="party"></select></div>
 <div><label>ベース可変ロール数</label><input type="number" id="rolls" value="20" min="5" max="40"></div>
 <div><label>チャージロール数 (必ず消費)</label><input type="number" id="er" value="0" min="0" max="40"></div>
 <button id="go">計算開始</button>
</div>
<div class="bar"><div><label>武器で絞り込み</label><select id="fw"></select></div><div><label>聖遺物セットで絞り込み</label><select id="fs"></select></div><span class="sm" id="info"></span></div>
<div class="tw"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div class="sm" style="margin-top:8px">※ Crit Value = 会心率×2 + 会心ダメ。<b>冠のメインステとサブステの合計のみ</b>で、初期値(5%/50%)・武器・突破・共鳴・天賦の会心は含みません。セルにカーソルを合わせる(長押し)と、最終の会心率・会心ダメが出ます。</div></div>
</div>
<script>
var LOADFAIL=[];function lf(e){LOADFAIL.push(e.getAttribute("src"));}
// 読み込むファイルの一覧 (新しいキャラを追加したら、ここにファイル名を1つ足す)
var CHARACTER_FILES=['nahida','alhaitham','tighnari','yaemiko','xingqiu','yelan'];
// 更新番号: ファイルを更新したら変える (古いキャッシュを使わせない)。ローカルで開くときは付けない
var V=location.protocol==='file:'?'':'?v=20261023q';
['common.js'].concat(CHARACTER_FILES.map(function(c){return 'characters/'+c+'.js';})).forEach(function(f){
  document.write('<script src="'+f+V+'" onerror="lf(this)"><\/script>');
});
</script>
<script>
const $=id=>document.getElementById(id);
const NEED_ENGINE=3,NEED_CHAR=2;   // この画面が必要とする common.js の版 / キャラのファイルの版
// ファイルの版が食い違っているとき (一部のファイルだけ更新したときなど) に、画面に理由を出す
(function(){
  const ver=(typeof Engine!=='undefined'&&Engine.version)||0,msgs=[];
  if(!ver)msgs.push((typeof LOADFAIL!=='undefined'&&LOADFAIL.length)
    ?'ファイルを読み込めません。index.html と同じ場所に、common.js と characters フォルダがあるか確認してください (zipの中から開いていませんか? 先に「すべて展開」してから、展開したフォルダの index.html を開いてください)。'
    :'common.js が古い版です。最新の common.js をアップロードしてください。');
  else if(ver<NEED_ENGINE)msgs.push('common.js が古い版です (v'+ver+' / 必要: v'+NEED_ENGINE+')。最新の common.js をアップロードしてください。');
  const old=(window.CHARACTERS||[]).filter(c=>(c.engine||0)<NEED_CHAR).map(c=>c.name);
  if(old.length)msgs.push('キャラのファイルが最新版ではありません: '+old.join('、')+' (計算は動きますが、数値が古い可能性があります。characters フォルダの最新版をアップロードしてください)');
  if(typeof LOADFAIL!=='undefined'&&LOADFAIL.length)msgs.push('読み込めなかったファイル: '+LOADFAIL.join(' , '));
  if(msgs.length){$('warn').hidden=false;$('warn').innerHTML='⚠ '+msgs.join('<br>⚠ ');}
})();
const IMG_EXT='webp';   // 画像の拡張子 (png に戻す場合はここだけ変更)
// 画像の有無を記憶 (IMGS[パス]=true/false)。無い画像は2回目以降は出さない → 絞り込みのたびに空欄が出て詰まるチラつきを防ぐ
const IMGS={};
const img=p=>IMGS[p]===false?'':`<img class="ic" src="${p}" alt=""${IMGS[p]?'':' style="display:none"'} onload="IMGS['${p}']=true;this.style.display=''" onerror="IMGS['${p}']=false;this.remove()">`;
const ELEM={dendro:'草',electro:'雷',pyro:'炎',hydro:'水',cryo:'氷',anemo:'風',geo:'岩'};
// 属性・武器種のアイコン (images/others/ のファイル名に合わせる。大文字小文字も一致させること)
const ELICON={pyro:'pyro',hydro:'hydro',electro:'electro',dendro:'dendro',anemo:'anemo',geo:'geo',cryo:'cryo'};
const WICON={'片手剣':'sword_one_hand','両手剣':'claymore','長柄武器':'lance','弓':'bow','法器':'catalyst'};
const oimg=n=>n?img('images/others/'+n+'.'+IMG_EXT):'';
// ステータスのアイコン (images/others/ のファイル名)。画像が無い間は、略称(攻/HP/熟/防)を出す
const STATICON={atk:'stat_atk',hp:'stat_hp',em:'stat_em',def:'stat_def',er:'stat_er',cr:'stat_cr',cd:'stat_cd',phys:'stat_physical',heal:'stat_healing'},
      STATABBR={atk:'攻',hp:'HP',em:'熟',def:'防',er:'充',cr:'率',cd:'傷',phys:'物',heal:'治'};
const iconNum=(file,abbr,text,title)=>`<span class="ref" title="${title}"><span class="ico">${oimg(file)}<span class="ab">${abbr}</span></span>${text}</span>`;
const refCell=(x,r,f)=>r?`<span class="ref" title="${r.label}"><span class="ico">${oimg(STATICON[r.key])}<span class="ab">${STATABBR[r.key]||r.label}</span></span>${f(x[r.key])}</span>`:'';
const COLS=[['#'],['武器'],['聖遺物セット'],['メインステ (時計/杯/冠)'],['サブステ割振 [上限]'],['Crit Value','cv'],['元素バフ','buff'],['参照1','r1'],['参照2','r2'],['チャージ','er'],['期待値ダメージ','dmg']];
let ch=null,all=[],sk='dmg',dir=-1,calcMs=0,shown=100;const PAGE=100;   // 表は上位100件ずつ表示 (行が多いキャラでも軽く)
if(typeof CHARACTERS==='undefined'||!CHARACTERS.length){$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">キャラデータを読み込めませんでした。<br>読み込めなかったファイル: '+(LOADFAIL.length?LOADFAIL.join(' , '):'(読み込みは成功したがデータが空 → ファイルの中身を確認)')+'</div>';window.CHARACTERS=[];}
const ELORD=['pyro','hydro','electro','dendro','anemo','geo','cryo'],WORD=['片手剣','両手剣','長柄武器','弓','法器'];
const F={r:'',e:'',w:''};let order=-1;   // order: -1=実装が新しい順 / 1=古い順
function chips(id,k,opts){
  $(id).innerHTML=[['','すべて']].concat(opts).map(([v,l])=>`<button class="chip${F[k]===v?' on':''}" data-v="${v}">${l}</button>`).join('');
  $(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{F[k]=b.dataset.v;buildFilters();renderGrid();});
}
function buildFilters(){
  const C=window.CHARACTERS;
  chips('f-r','r',[['5','★5'],['4','★4']]);
  chips('f-e','e',ELORD.filter(e=>C.some(c=>c.element===e)).map(e=>[e,oimg(ELICON[e])+ELEM[e]]));
  const ws=WORD.filter(w=>C.some(c=>c.weaponType===w)).concat([...new Set(C.map(c=>c.weaponType))].filter(w=>!WORD.includes(w)));
  chips('f-w','w',ws.map(w=>[w,oimg(WICON[w])+w]));
  $('sort').textContent='実装日: '+(order<0?'新しい順 ▼':'古い順 ▲');
}
function renderGrid(){
  const L=window.CHARACTERS.filter(c=>(!F.r||String(c.rarity)===F.r)&&(!F.e||c.element===F.e)&&(!F.w||c.weaponType===F.w))
    .sort((a,b)=>order*(a.release||'').localeCompare(b.release||''));
  $('cnt').textContent=L.length+' / '+window.CHARACTERS.length+' キャラ';
  $('grid').innerHTML=L.length?L.map(c=>`<a class="card" href="#${c.id}">${img('images/characters/'+c.id+'.'+IMG_EXT)}<div><b>${c.name}</b> <span class="star">${c.rarity?'★'.repeat(c.rarity):'<span class="warn">⚠レア度なし</span>'}</span><div class="sm">${oimg(WICON[c.weaponType])}${c.weaponType} ${oimg(ELICON[c.element])}${ELEM[c.element]||c.element}元素</div><div class="sm">${c.release?'v'+c.version+' ('+c.release+')':'<span class="warn">⚠実装日なし (キャラファイルが古い可能性)</span>'}</div></div></a>`).join(''):'<div class="empty" style="grid-column:1/-1">条件に合うキャラがいません</div>';
}
$('sort').onclick=()=>{order=-order;buildFilters();renderGrid();};
if(window.CHARACTERS.length){buildFilters();renderGrid();}else{$('flt').hidden=true;}
function route(){
  ch=CHARACTERS.find(c=>c.id===location.hash.slice(1))||null;
  $('portal').hidden=!!ch;$('view').hidden=!ch;if(!ch)return;
  $('vt').textContent=ch.name+' ― 最適サブステ割り振り';all=[];
  $('party').innerHTML=ch.parties.map(p=>`<option value="${p.key}">${p.name}</option>`).join('');
  sig='';fillFilters(true);
}
// パーティごとに使える武器・セットが変わるキャラ(八重神子など)に対応: 候補が変わったら古い結果は消す
let sig='';
function fillFilters(first){
  const A=Engine.avail(ch,$('party').value),pw=$('fw').value,ps=$('fs').value;
  const s=JSON.stringify([A.weapons.map(x=>x[0]),A.sets.map(x=>x.key)]);
  $('fw').innerHTML='<option value="">すべての武器</option>'+A.weapons.map(([k,w])=>`<option value="${k}">${w.name}</option>`).join('');
  $('fs').innerHTML='<option value="">すべての聖遺物セット</option>'+A.sets.map(x=>`<option value="${x.key}">${x.name}</option>`).join('');
  if(A.weapons.some(([k])=>k===pw))$('fw').value=pw;
  if(A.sets.some(x=>x.key===ps))$('fs').value=ps;
  if(!first&&s!==sig)all=[];
  sig=s;render();
}
$('party').onchange=()=>fillFilters(false);
$('go').onclick=()=>{
  const rolls=+$('rolls').value||20,er=Math.min(rolls,Math.max(0,+$('er').value||0));
  const t0=performance.now();
  try{
    all=Engine.optimize(ch,{rolls,erRolls:er,party:$('party').value}).map(x=>Object.assign(x,{er:x.er!=null?x.er:100+Engine.ER_ROLL*er,vcr:x.cvCr!=null?x.cvCr:x.cr,vcd:x.cvCd!=null?x.cvCd:x.cd}));
    all.forEach(x=>{x.cv=2*x.vcr+x.vcd;});
  }catch(e){
    all=[];render();console.error(e);
    $('info').innerHTML='<span class="warn">計算エラー: '+e.message+' ― common.js とキャラのファイルの版が合っていない可能性があります (全部まとめて最新版をアップロードしてください)</span>';
    return;
  }
  calcMs=performance.now()-t0;shown=PAGE;
  render();
};
$('fw').onchange=$('fs').onchange=()=>{shown=PAGE;render();};
const keyFn=k=>{const r=ch.refs;return {cv:x=>x.cv,buff:x=>x.elemBuff,r1:x=>x[r[0].key],r2:x=>r[1]?x[r[1].key]:-1,er:x=>x.er,dmg:x=>x.damage}[k];};
function render(){
  $('head').innerHTML=COLS.map(([n,k])=>`<th ${k?`data-k="${k}"`:''} class="${k===sk?'on':''}">${n}${k===sk?(dir<0?' ▼':' ▲'):''}</th>`).join('');
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;dir=k===sk?-dir:-1;sk=k;shown=PAGE;render();});
  const fw=$('fw').value,fs=$('fs').value;
  const kf=keyFn(sk);
  const list=all.filter(x=>(!fw||x.weaponKey===fw)&&(!fs||x.setKey===fs)).sort((a,b)=>dir*(kf(a)-kf(b)));
  const vis=list.slice(0,shown);
  $('info').textContent=all.length?`表示 ${vis.length} / 絞り込み ${list.length} / 全 ${all.length} パターン (計算 ${calcMs.toFixed(0)}ms)`:'';
  const f=v=>Math.round(v).toLocaleString();
  $('body').innerHTML=all.length?vis.map((x,i)=>`<tr><td>${i+1}</td><td>${img('images/weapons/'+x.weaponKey+'.'+IMG_EXT)}${x.weaponName}</td>
   <td>${img('images/artifacts/'+x.setKey+'.'+IMG_EXT)}${x.setName}</td><td>${x.mainNames}</td>
   <td>${ch.subStats.map((s,q)=>ch.subLabels[q]+' <b>'+x.rolls[s]+'</b><span class="sm">['+x.caps[s]+']</span>').join(' / ')}</td>
   <td title="最終の会心率 ${x.cr.toFixed(1)}% / 会心ダメ ${x.cd.toFixed(1)}%"><span class="sm">${x.vcr.toFixed(1)} : ${x.vcd.toFixed(1)}</span> <span class="cv">${x.cv.toFixed(1)} cv</span></td><td>${iconNum(ch.element==='physical'?STATICON.phys:ELICON[ch.element],ELEM[ch.element]||'元',x.elemBuff.toFixed(1)+'%',(ELEM[ch.element]||'')+'元素ダメージバフ')}</td>
   <td>${refCell(x,ch.refs[0],f)}</td><td>${refCell(x,ch.refs[1],f)}</td>
   <td>${iconNum(STATICON.er,STATABBR.er,x.er.toFixed(1)+'%','元素チャージ効率')}</td><td><b>${x.damage.toLocaleString()}</b></td></tr>`).join('')+(list.length>vis.length?`<tr><td colspan="11" class="empty"><button class="chip on" id="more">さらに${Math.min(PAGE,list.length-vis.length)}件表示 (残り ${list.length-vis.length}件)</button></td></tr>`:''):`<tr><td colspan="11" class="empty">条件を決めて「計算開始」を押してください</td></tr>`;
  if($('more'))$('more').onclick=()=>{shown+=PAGE;render();};
}
addEventListener('hashchange',route);route();
</script></body></html>
